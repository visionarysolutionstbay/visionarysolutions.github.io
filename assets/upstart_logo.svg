<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d14"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0eeff"/>
      <stop offset="100%" style="stop-color:#5aafe0"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5aafe0;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#5aafe0;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8dff0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5aafe0"/>
      <stop offset="100%" style="stop-color:#5aafe0;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bgClip">
      <rect width="700" height="280" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="700" height="280" rx="6" fill="url(#bgGrad)"/>

  <!-- Subtle noise texture overlay -->
  <rect width="700" height="280" rx="6" fill="none" stroke="#1a3a5c" stroke-width="1" opacity="0.5"/>

  <!-- Light ray emanating from squeegee -->
  <polygon points="110,40 180,40 280,280 60,280" fill="url(#rayGrad)" clip-path="url(#bgClip)"/>

  <!-- Secondary subtle ray -->
  <polygon points="130,40 155,40 200,280 100,280" fill="url(#rayGrad)" opacity="0.3" clip-path="url(#bgClip)"/>

  <!-- === SQUEEGEE ICON === -->
  <!-- Handle - angled diagonally for dynamic feel -->
  <g transform="translate(120, 140) rotate(-35)">
    <!-- Handle rod -->
    <rect x="-5" y="-95" width="10" height="90" rx="3" fill="#1e3a5a"/>
    <rect x="-4" y="-95" width="4" height="90" rx="2" fill="#2a5070" opacity="0.6"/>
    <!-- Handle grip rings -->
    <rect x="-5.5" y="-80" width="11" height="4" rx="1" fill="#3a7090"/>
    <rect x="-5.5" y="-65" width="11" height="4" rx="1" fill="#3a7090"/>
    <rect x="-5.5" y="-50" width="11" height="4" rx="1" fill="#3a7090"/>

    <!-- Channel/bar -->
    <rect x="-28" y="0" width="56" height="10" rx="2" fill="#1a3050"/>
    <rect x="-28" y="0" width="56" height="3" rx="1" fill="#3a7090" opacity="0.5"/>

    <!-- Squeegee rubber blade -->
    <rect x="-26" y="10" width="52" height="6" rx="1" fill="url(#bladeGrad)" filter="url(#softGlow)"/>

    <!-- Blade edge highlight -->
    <rect x="-26" y="15" width="52" height="1.5" rx="0.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Water droplets trailing from blade -->
  <g filter="url(#softGlow)" opacity="0.7">
    <ellipse cx="155" cy="175" rx="2" ry="3.5" fill="#5aafe0"/>
    <ellipse cx="148" cy="185" rx="1.5" ry="2.5" fill="#5aafe0" opacity="0.6"/>
    <ellipse cx="160" cy="182" rx="1.2" ry="2" fill="#5aafe0" opacity="0.5"/>
    <ellipse cx="143" cy="193" rx="1" ry="1.8" fill="#5aafe0" opacity="0.4"/>
    <ellipse cx="153" cy="196" rx="0.8" ry="1.4" fill="#5aafe0" opacity="0.3"/>
  </g>

  <!-- Clean streak line left by squeegee -->
  <line x1="94" y1="148" x2="77" y2="210" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>

  <!-- === DIVIDER LINE === -->
  <line x1="210" y1="60" x2="210" y2="220" stroke="#1e3a5a" stroke-width="1.5"/>
  <line x1="210" y1="60" x2="210" y2="220" stroke="#5aafe0" stroke-width="0.5" opacity="0.4"/>

  <!-- === TYPOGRAPHY === -->
  <!-- VISIONARY -->
  <text x="240" y="138"
    font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="8"
    fill="url(#textGrad)">VISIONARY</text>

  <!-- Thin separator -->
  <rect x="240" y="150" width="420" height="1" fill="url(#accentGrad)"/>

  <!-- SOLUTIONS with blue accent -->
  <text x="241" y="208"
    font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="10"
    fill="#5aafe0"
    filter="url(#strongGlow)">SOLUTIONS</text>

  <!-- Tagline -->
  <text x="242" y="235"
    font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="5"
    fill="#5aafe0"
    opacity="0.55">WINDOW  &amp;  GUTTER  SPECIALISTS</text>

</svg>
